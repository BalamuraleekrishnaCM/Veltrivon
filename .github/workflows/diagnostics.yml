name: Diagnostics MVP
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/Veltrivon.Cli/Veltrivon.Cli.csproj -c Release
      - run: dotnet run --project tests/Veltrivon.Diagnostics.Tests -c Release
      - run: dotnet publish src/Veltrivon.Cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/diagnostics
      - name: Smoke test CLI help
        run: |
          & ./artifacts/diagnostics/Veltrivon.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: veltrivon-diagnostics-win-x64
          path: artifacts/diagnostics/Veltrivon.exe
